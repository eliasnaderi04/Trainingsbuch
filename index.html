<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12151a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trainingsbuch">
<title>Trainingsbuch</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<style>
/* Layout: eine Spalte für den Daumen, Stahlgrau als Grund, Hantelscheiben als Farbsystem.
   Keine externen Schriften, damit die App auch ohne Empfang im Studio vollständig läuft. */
:root{
  color-scheme:dark;
  --bg:#12151a; --surface:#1b2027; --surface2:#262c35; --line:#343c47;
  --ink:#eef1f4; --muted:#9aa5b1; --faint:#6f7a87;
  --chalk:#eef1f4; --on-chalk:#12151a;
  --good:#3fb68b; --danger:#ff7b72;
  --display:"DIN Condensed","Roboto Condensed","sans-serif-condensed","Arial Narrow",sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --tabbar:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--body);font-variant-numeric:tabular-nums;overscroll-behavior-y:none}
body.locked{overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--chalk);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3,p{margin:0}

#view{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px;
  padding-top:calc(16px + env(safe-area-inset-top,0px));
  padding-bottom:calc(var(--tabbar) + 28px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.head>div{min-width:0}
h1{font:700 36px/1 var(--display);letter-spacing:.02em;text-transform:uppercase;padding-top:4px}
h2{font:700 21px/1.1 var(--display);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.sub{color:var(--muted);font-size:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.empty{color:var(--muted);background:var(--surface);border-radius:12px;padding:18px 16px;font-size:15px}

/* Buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 18px;border-radius:12px;background:var(--surface2);font-weight:600;text-align:center}
.btn:active{filter:brightness(1.2)}
.btn.primary{background:var(--chalk);color:var(--on-chalk)}
.btn.danger{background:none;color:var(--danger);border:1px solid var(--line)}
.btn.small{min-height:44px;padding:0 14px;font-size:15px}
.btn.wide{width:100%}
.link{min-height:44px;padding:0 4px;color:var(--muted);font-size:15px;text-decoration:underline;text-underline-offset:3px}

/* Scheibe: das wiederkehrende Zeichen für Trainingstage */
.plate{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;color:var(--on-chalk);font:700 22px/1 var(--display);padding-top:2px;box-shadow:inset 0 0 0 3px rgba(0,0,0,.18)}
.plate.s{width:26px;height:26px;font-size:15px;box-shadow:none}
.dot{flex:none;display:inline-block;width:12px;height:12px;border-radius:50%}

/* Trainingsstart */
.start{display:flex;align-items:center;gap:14px;width:100%;min-height:80px;padding:14px;border-radius:14px;background:var(--surface);text-align:left;border:1px solid transparent}
.start:active{background:var(--surface2)}
.start.next{border-color:var(--chalk)}
.start b{display:block;font:700 27px/1 var(--display);letter-spacing:.02em;text-transform:uppercase;padding-top:2px}
.start span.meta{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.tag{flex:none;padding:3px 8px;border-radius:6px;background:var(--surface2);color:var(--ink);font-size:12px;font-weight:600}
.next .tag{background:var(--chalk);color:var(--on-chalk)}
.tag.pr{background:var(--ink);color:var(--on-chalk);font-weight:700;letter-spacing:.04em}

/* Listen */
.list{display:flex;flex-direction:column;background:var(--surface);border-radius:14px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;width:100%;min-height:62px;padding:10px 14px;text-align:left;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
button.item:active{background:var(--surface2)}
.item .t{display:block;font-weight:600;overflow-wrap:anywhere}
.item .m{display:block;color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.item .v{flex:none;text-align:right;font-weight:600}
.list-h{display:flex;align-items:center;gap:8px;padding:6px 2px 0}

/* Filter */
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;min-height:42px;padding:0 13px;border-radius:21px;background:var(--surface);color:var(--muted);font-size:15px;white-space:nowrap}
.chip.on{background:var(--chalk);color:var(--on-chalk);font-weight:600}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:flex;background:var(--surface);border-radius:11px;padding:3px}
.seg button{flex:1;min-width:0;min-height:42px;border-radius:8px;color:var(--muted);font-size:15px;padding:0 4px}
.seg button.on{background:var(--surface2);color:var(--ink);font-weight:600}

/* Eingaben */
label.f{display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:14px;min-width:0}
.input,select.input{width:100%;min-height:52px;padding:0 13px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:17px}
input[type=date].input{-webkit-appearance:none;appearance:none;min-width:0}
.input:focus{outline:0;border-color:var(--chalk)}
.err{color:var(--danger);font-size:14px}

/* Training */
.ex{background:var(--surface);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.ex-h{display:flex;align-items:center;gap:9px}
.ex-h h3{flex:1;min-width:0;font-size:18px;font-weight:650;overflow-wrap:anywhere}
.icon{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:9px;color:var(--muted);font-size:20px}
.icon:active{background:var(--surface2)}
.last{color:var(--muted);font-size:14px}
.sets{display:grid;grid-template-columns:30px 1fr 1fr 54px 30px;gap:6px;align-items:center}
.sets .h{color:var(--faint);font-size:13px;text-align:center}
.setrow{display:contents}
.n{position:relative;text-align:center;color:var(--muted);font-weight:600}
.sets input{width:100%;min-width:0;height:54px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);text-align:center;font-size:21px;font-weight:600;padding:0}
.sets input::placeholder{color:var(--faint);font-weight:500}
.sets input:focus{outline:0;border-color:var(--chalk)}
.setrow.ok input{border-color:transparent;background:var(--surface2)}
.ck{height:54px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;color:var(--muted)}
.ck svg{width:24px;height:24px}
.setrow.ok .ck{background:var(--good);color:#0b1f17}
.x{height:54px;color:var(--faint);font-size:19px}
.prflag{grid-column:1/-1;font-size:13px;color:var(--ink);font-weight:600;margin:-2px 0 2px 36px}
.bar{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Kennzahlen */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tiles.two{grid-template-columns:repeat(2,1fr)}
.tile{background:var(--surface);border-radius:12px;padding:11px 12px;min-width:0}
.tile b{display:block;font:700 30px/1.05 var(--display);padding-top:3px;overflow-wrap:anywhere}
.tile span{display:block;color:var(--muted);font-size:13px;line-height:1.25}
.goal{background:var(--surface);border-radius:14px;padding:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.goal b{display:block;font:700 34px/1 var(--display);padding-top:3px}

/* Diagramm */
.chart{position:relative;background:var(--surface);border-radius:14px;padding:6px 4px 4px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.chart svg{display:block;width:100%;height:auto;overflow:hidden}
.chart text{font:12px var(--body);fill:var(--muted)}
.chart text.lab{fill:var(--ink);font-weight:650}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);font-size:14px}
.legend i{display:inline-block;width:18px;height:0;border-top:3px solid;vertical-align:middle;margin-right:6px}
.tip{position:absolute;top:8px;z-index:3;pointer-events:none;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:13px;white-space:nowrap}
.tip div{display:flex;align-items:center;gap:7px;color:var(--muted)}
.tip b{color:var(--ink);font-size:15px}
.tip i{display:inline-block;width:12px;border-top:3px solid}

/* Kalender */
.cal-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal-h button.icon{background:var(--surface);width:48px;height:48px;color:var(--ink)}
.cal-h .mon{font:700 26px/1 var(--display);letter-spacing:.03em;text-transform:uppercase;min-height:44px;padding-top:9px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .wd{text-align:center;color:var(--faint);font-size:13px;padding-bottom:3px}
.day{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:1px;min-height:58px;padding:3px 0;border-radius:9px;min-width:0}
.day:active{background:var(--surface)}
.day .num{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;font-weight:500;color:var(--muted)}
.day.has .num{color:var(--on-chalk);font-weight:700}
.day.today .num{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--chalk);color:var(--ink)}
.day.today.has .num{color:var(--on-chalk)}
.day .ty{font-size:11px;color:var(--muted);line-height:1.2;font-weight:600}

/* Bottom Sheet, Tabs, Toast */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
#tabs button{flex:1;max-width:112px;min-width:0;height:var(--tabbar);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--faint);font-size:11.5px;position:relative}
#tabs button.on{color:var(--ink);font-weight:600}
#tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#tabs .live{position:absolute;top:9px;left:calc(50% + 9px);width:9px;height:9px;border-radius:50%;background:var(--good)}
#sheet{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;background:rgba(5,7,9,.62)}
#panel{width:100%;max-width:560px;max-height:88dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--surface);border-radius:18px 18px 0 0;display:flex;flex-direction:column;gap:14px;
  padding-top:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#panel h2{color:var(--ink);font-size:26px}
#panel .input{background:var(--bg)}
#panel .item{padding-left:0;padding-right:0}
#panel .list{background:none;border-radius:0}
#panel .chip{background:var(--surface2)}
#panel .chip.on{background:var(--chalk)}
.sheet-x{display:flex;align-items:center;justify-content:space-between;gap:10px}
.gr{display:grid;grid-template-columns:52px 1fr 44px;gap:8px;align-items:center}
.gr input[type=color]{width:52px;height:52px;padding:0;border:0;border-radius:10px;background:none;-webkit-appearance:none;appearance:none}
.gr input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.gr input[type=color]::-webkit-color-swatch{border:0;border-radius:10px}
.gr input[type=color]::-moz-color-swatch{border:0;border-radius:10px}
.gr.d{grid-template-columns:52px 1fr 40px 40px;gap:6px}
.icon.off{visibility:hidden}
.pl{display:grid;grid-template-columns:12px 1fr 40px 40px 40px 40px;gap:6px;align-items:center;min-height:58px;border-top:1px solid var(--line)}
.pl:first-child{border-top:0}
.pl .t{font-weight:600;overflow-wrap:anywhere;min-width:0}
.pl .t small{display:block;color:var(--muted);font-weight:400;font-size:14px}
.pl .icon{background:var(--surface2);color:var(--ink)}
.pl .icon:disabled{opacity:.35}
.pl .icon.off{visibility:hidden}
.radio{position:absolute;opacity:0;pointer-events:none}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabbar) + 14px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:center;gap:14px;width:max-content;max-width:calc(100% - 32px);padding:12px 16px;border-radius:11px;background:var(--chalk);color:var(--on-chalk);font-size:15px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.45)}
#toast button{text-decoration:underline;font-weight:700;min-height:28px}
#warn{position:sticky;top:0;z-index:15;background:var(--danger);color:#2a0705;font-size:14px;font-weight:600;padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px}
@media (prefers-reduced-motion:no-preference){
  #panel{animation:up .18s ease-out}
  @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
}
</style>
</head>
<body>
<div id="warn" hidden></div>
<main id="view"></main>
<nav id="tabs" aria-label="Hauptnavigation"></nav>
<div id="sheet" hidden><div id="panel" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status" hidden></div>

<script>
'use strict';
/* ---------- Grundlagen ---------- */
const KEY='trainingsbuch.v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,'0');

/* Datumswerte bleiben lokale Kalendertage ("JJJJ-MM-TT"). Gerechnet wird in ganzen Tagen,
   damit Zeitumstellung und UTC-Versatz keinen Tag verschieben. */
const todayStr=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const dayNum=s=>{const[y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)/864e5};
const weekStart=n=>n-((n+3)%7+7)%7;
const utc=s=>new Date(dayNum(s)*864e5);
const fd=(s,o)=>utc(s).toLocaleDateString('de-DE',{timeZone:'UTC',...o});
const dShort=s=>fd(s,{day:'numeric',month:'short'}).replace(/\.$/,'');
const dLong=s=>fd(s,{weekday:'short',day:'numeric',month:'short'}).replace(/\.$/,'');
const dNumStr=n=>new Date(n*864e5).toISOString().slice(0,10);
const num=(n,dec=2)=>n==null?'–':n.toLocaleString('de-DE',{maximumFractionDigits:dec});
const parseNum=v=>{const s=String(v).trim().replace(',','.');if(s==='')return null;const n=parseFloat(s);return isFinite(n)&&n>=0?n:null};

/* ---------- Daten ---------- */
const DEFAULT_DAYS=[['torso','Torso','#e5484d'],['limbs','Limbs','#3e8fe8'],['ober','Oberkörper','#e9b949']];
const DAY_COLORS=['#3fb68b','#a58be6','#f0894a','#eef1f4','#f5a6d0','#4d9de0'];
const DEFAULT_GROUPS=[['brust','Brust','#ef6461'],['ruecken','Rücken','#4d9de0'],['schultern','Schultern','#e9b44c'],['bizeps','Bizeps','#7f6be0'],['trizeps','Trizeps','#f5a6d0'],['beine','Beine','#1f9c8f'],['bauch','Bauch','#f0894a']];
const EXAMPLES=[
 ['Bankdrücken','brust',['torso']],['Rudern am Kabel','ruecken',['torso']],['Latzug','ruecken',['torso']],['Beinheben','bauch',['torso']],
 ['Kniebeuge','beine',['limbs']],['Beinpresse','beine',['limbs']],['Beinbeuger','beine',['limbs']],['Bizepscurls','bizeps',['limbs']],['Trizepsdrücken am Kabel','trizeps',['limbs']],
 ['Schrägbankdrücken','brust',['ober']],['Schulterdrücken','schultern',['ober']],['Klimmzüge','ruecken',['ober']],['Seitheben','schultern',['ober']]];

function seed(){return validate({
  days:DEFAULT_DAYS.map(([id,name,color])=>({id,name,color})),
  groups:DEFAULT_GROUPS.map(([id,name,color])=>({id,name,color})),
  exercises:EXAMPLES.map(([name,groupId,days])=>({id:uid(),name,groupId,days,example:true})),
  workouts:[],weights:[],goal:80,activeId:null,lastBackup:null})}

function validate(d){
  const bad=m=>{throw new Error(m)};
  if(!d||typeof d!=='object'||![d.groups,d.exercises,d.workouts,d.weights].every(Array.isArray))bad('Das ist keine Backup-Datei dieser App.');
  const isDate=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(dayNum(s));
  const str=s=>typeof s==='string'&&s.trim()!=='';
  const n0=v=>v===null||(typeof v==='number'&&isFinite(v)&&v>=0);
  const groups=d.groups.map(g=>{if(!str(g?.id)||!str(g?.name)||!/^#[0-9a-f]{6}$/i.test(g.color))bad('Eine Muskelgruppe in der Datei ist fehlerhaft.');return{id:g.id,name:g.name,color:g.color}});
  const gids=new Set(groups.map(g=>g.id));
  // Stände von vor Version 2 kennen keine Trainingstage: Sie erhalten die alten drei mit denselben IDs.
  const rawDays=Array.isArray(d.days)?d.days:DEFAULT_DAYS.map(([id,name,color])=>({id,name,color}));
  const days=rawDays.map(x=>{if(typeof x?.id!=='string'||!/^[\w-]+$/.test(x.id)||!str(x.name)||!/^#[0-9a-f]{6}$/i.test(x.color))bad('Ein Trainingstag in der Datei ist fehlerhaft.');
    const o={id:x.id,name:x.name,color:x.color};if(x.archived)o.archived=true;return o});
  if(!days.some(x=>!x.archived))bad('Die Datei enthält keinen aktiven Trainingstag.');
  const dids=new Set(days.map(x=>x.id));
  const exercises=d.exercises.map(e=>{
    if(!str(e?.id)||!str(e?.name))bad('Eine Übung in der Datei ist fehlerhaft.');
    if(!e.deleted&&!gids.has(e.groupId))bad(`Die Übung „${e.name}“ verweist auf eine unbekannte Muskelgruppe.`);
    const o={id:e.id,name:e.name,groupId:e.groupId};
    if(e.example)o.example=true;if(e.deleted)o.deleted=true;return o});
  const eids=new Set(exercises.map(e=>e.id));
  const workouts=d.workouts.map(w=>{
    if(!str(w?.id)||!isDate(w.date)||!dids.has(w.type)||!Array.isArray(w.items))bad('Ein Training in der Datei ist fehlerhaft.');
    return{id:w.id,date:w.date,type:w.type,items:w.items.map(it=>{
      if(!eids.has(it?.exerciseId)||!Array.isArray(it.sets))bad(`Das Training vom ${w.date} verweist auf eine unbekannte Übung.`);
      return{exerciseId:it.exerciseId,sets:it.sets.map(s=>{if(!n0(s?.reps)||!n0(s?.kg))bad(`Das Training vom ${w.date} enthält ungültige Sätze.`);return{reps:s.reps,kg:s.kg}})}})}});
  const weights=d.weights.map(x=>{if(!str(x?.id)||!isDate(x.date)||typeof x.kg!=='number'||!isFinite(x.kg)||x.kg<=0)bad('Ein Gewichtseintrag in der Datei ist fehlerhaft.');return{id:x.id,date:x.date,kg:x.kg}});
  // Trainingspläne (ab Version 3): Reihenfolge und Satzzahl je Tag. Ältere Stände übernehmen die bisherige
  // Zuordnung der Übungen in der alten Reihenfolge, mit der Satzzahl vom letzten Mal (sonst 3).
  const live=new Set(exercises.filter(e=>!e.deleted).map(e=>e.id));
  const lastCount=id=>{const w=[...workouts].sort((a,b)=>b.date.localeCompare(a.date)).find(w=>w.items.some(i=>i.exerciseId===id&&i.sets.some(s=>s.reps>0&&s.kg!=null)));
    const n=w?w.items.filter(i=>i.exerciseId===id).flatMap(i=>i.sets).filter(s=>s.reps>0&&s.kg!=null).length:3;return Math.min(20,Math.max(1,n))};
  days.forEach((day,k)=>{
    const raw=rawDays[k].plan;
    if(Array.isArray(raw)){const seen=new Set();day.plan=[];
      for(const p of raw){if(!live.has(p?.exerciseId)||!Number.isInteger(p.sets)||p.sets<1||p.sets>20)bad('Ein Trainingsplan in der Datei ist fehlerhaft.');
        if(!seen.has(p.exerciseId)){seen.add(p.exerciseId);day.plan.push({exerciseId:p.exerciseId,sets:p.sets})}}}
    else day.plan=d.exercises.filter(e=>live.has(e.id)&&Array.isArray(e.days)&&e.days.includes(day.id)).map(e=>({exerciseId:e.id,sets:lastCount(e.id)}));
  });
  const goal=typeof d.goal==='number'&&d.goal>0?d.goal:null;
  const activeId=workouts.some(w=>w.id===d.activeId)?d.activeId:null;
  return{version:3,days,groups,exercises,workouts,weights,goal,activeId,lastBackup:isDate(d.lastBackup)?d.lastBackup:null};
}

const dropFromPlans=exId=>S.days.forEach(d=>d.plan=d.plan.filter(p=>p.exerciseId!==exId));
function setPlanDays(exId,ids){
  for(const d of liveDays()){const has=d.plan.some(p=>p.exerciseId===exId),want=ids.includes(d.id);
    if(has&&!want)d.plan=d.plan.filter(p=>p.exerciseId!==exId);

}
const liveDays=()=>S.days.filter(d=>!d.archived);

const inkOn=hex=>{const c=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)/255).map(v=>v<=.04045?v/12.92:((v+.055)/1.055)**2.4);return .2126*c[0]+.7152*c[1]+.0722*c[2]>.18?'#12151a':'#f4f6f8'};
function letter(id){ // Anfangsbuchstabe; teilen sich Tage einen, kommt ein zweites Zeichen dazu (Push/Pull: Ph, Pl).
  const name=dayOf(id).name.trim(),first=s=>(Array.from(s)[0]||'?').toUpperCase();
  if(!S.days.some(x=>x.id!==id&&first(x.name.trim())===first(name)))return first(name);
  const words=name.split(/\s+/);
  return words.length>1?first(words[0])+first(words.at(-1)):first(name)+Array.from(name).at(-1);
}

const plate=(id,small)=>{const c=dayOf(id).color;return `<span class="plate ${small?'s':''}" style="background:${c};color:${inkOn(c)}">${le(id)}</span>`};
const liveEx=()=>S.exercises.filter(e=>!e.deleted);
const grp=id=>S.groups.find(g=>g.id===id)||{id:'',name:'Ohne Gruppe',color:'#6f7a87'};
const byName=(a,b)=>a.name.localeCompare(b.name,'de');
const complete=s=>s.reps!=null&&s.reps>0&&s.kg!=null;
const hasSets=w=>w.items.some(it=>it.sets.some(complete));
const doneW=()=>S.workouts.filter(hasSets);
const byDateDesc=(a,b)=>b.date.localeCompare(a.date);
const active=()=>S.workouts.find(w=>w.id===S.activeId);
const volume=w=>w.items.reduce((a,it)=>a+it.sets.filter(complete).reduce((x,s)=>x+s.reps*s.kg,0),0);
const setCount=w=>w.items.reduce((a,it)=>a+it.sets.filter(complete).length,0);

/* Vorschlag: letztes Mal VOR dem Datum dieses Trainings, also auch beim Nachtragen korrekt. */
function lastTime(exId,cur){
  const list=doneW().filter(w=>w.id!==cur?.id&&(!cur||w.date<=cur.date)).sort(byDateDesc);
  for(const w of list){
    const sets=w.items.filter(it=>it.exerciseId===exId).flatMap(it=>it.sets.filter(complete));
    if(sets.length)return{date:w.date,sets};
  }
  return null;
}
function bestBefore(exId,cur){
  let best=0;
  for(const w of doneW()){if(w.id===cur.id||w.date>cur.date)continue;
    for(const it of w.items)if(it.exerciseId===exId)for(const s of it.sets)if(complete(s)&&s.kg>best)best=s.kg}
  return best;
}
function nextType(before){
  const prev=doneW().filter(w=>!before||w.date<=before).sort(byDateDesc)[0];
  const ids=dayIds();
  return prev?ids[(ids.indexOf(prev.type)+1)%ids.length]:ids[0]; // Ein gelöschter letzter Tag beginnt wieder beim ersten.
}
function planItems(type){
  return dayOf(type).plan.filter(p=>ex(p.exerciseId)&&!ex(p.exerciseId).deleted).map(p=>({exerciseId:p.exerciseId,sets:Array.from({length:p.sets},()=>({reps:null,kg:null}))}));
}
function exHistory(id){
  const out=[];
  for(const w of doneW().sort((a,b)=>a.date.localeCompare(b.date))){
    const sets=w.items.filter(it=>it.exerciseId===id).flatMap(it=>it.sets.filter(complete));
    if(!sets.length)continue;
    out.push({id:w.id,date:w.date,sets,
      weight:Math.max(...sets.map(s=>s.kg)),
      rm:Math.max(...sets.map(s=>s.reps===1?s.kg:s.kg*(1+s.reps/30))),
      volume:sets.reduce((a,s)=>a+s.kg*s.reps,0),
      reps:Math.max(...sets.map(s=>s.reps))});
  }
  return out;
}
function weightSeries(){
  const a=[...S.weights].sort((x,y)=>x.date.localeCompare(y.date));
  return a.map(e=>{const d=dayNum(e.date);
    const win=a.filter(o=>{const n=dayNum(o.date);return n>d-7&&n<=d});
    return{...e,d,avg:win.reduce((s,o)=>s+o.kg,0)/win.length}});
}
function streak(){
  const wk=new Set(doneW().map(w=>weekStart(dayNum(w.date))));
  let cur=weekStart(dayNum(todayStr())),n=0;
  if(!wk.has(cur))cur-=7; // Die laufende Woche bricht die Serie erst, wenn sie vorbei ist.
  while(wk.has(cur)){n++;cur-=7}
  return n;
}

/* ---------- Diagramm ---------- */
function niceStep(raw){const p=10**Math.floor(Math.log10(raw)),f=raw/p;return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
let charts=[];
function drawChart(host,cfg){
  host.innerHTML='';
  const all=cfg.series.flatMap(s=>s.pts);
  const W=Math.max(280,host.clientWidth-8),H=cfg.h||236,m={t:24,r:14,b:26,l:44},iw=W-m.l-m.r,ih=H-m.t-m.b;
  const ds=[...new Set(all.map(p=>p.d))].sort((a,b)=>a-b),x0=ds[0],x1=ds.at(-1);
  const X=d=>x1===x0?m.l+iw/2:m.l+(d-x0)/(x1-x0)*iw;
  let lo=Math.min(...all.map(p=>p.v)),hi=Math.max(...all.map(p=>p.v));
  if(cfg.goal!=null){lo=Math.min(lo,cfg.goal);hi=Math.max(hi,cfg.goal)}
  if(lo===hi){lo-=1;hi+=1}
  const padY=(hi-lo)*.14;lo=Math.max(0,lo-padY);hi+=padY;
  const step=niceStep((hi-lo)/4);lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;
  const Y=v=>m.t+(hi-v)/(hi-lo)*ih;
  const svgNS='http://www.w3.org/2000/svg';
  let o=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(cfg.label)}">`;
  for(let v=lo;v<=hi+step/2;v+=step){
    o+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/>`;
    o+=`<text x="${m.l-7}" y="${Y(v)+4}" text-anchor="end">${esc(num(v,2))}</text>`;
  }
  const n=Math.min(4,ds.length),span=x1-x0,long=span>300;
  const lbl=d=>{const s=dNumStr(d);return long?fd(s,{month:'short',year:'2-digit'}):fd(s,{day:'numeric',month:'numeric'})};
  if(span===0)o+=`<text x="${X(x0)}" y="${H-7}" text-anchor="middle">${esc(lbl(x0))}</text>`;
  else for(let k=0;k<n;k++){const d=x0+Math.round(k*span/(n-1));
    o+=`<text x="${X(d)}" y="${H-7}" text-anchor="${k===0?'start':k===n-1?'end':'middle'}">${esc(lbl(d))}</text>`}
  if(cfg.goal!=null){
    o+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(cfg.goal)}" y2="${Y(cfg.goal)}" stroke="var(--good)" stroke-width="2" stroke-dasharray="6 5"/>`;
    o+=`<text class="lab" x="${W-m.r}" y="${Y(cfg.goal)-6}" text-anchor="end">Ziel ${esc(num(cfg.goal))} kg</text>`;
  }
  for(const s of cfg.series){
    const pts=[...s.pts].sort((a,b)=>a.d-b.d);
    if(pts.length>1)o+=`<path d="M${pts.map(p=>`${X(p.d).toFixed(1)} ${Y(p.v).toFixed(1)}`).join('L')}" fill="none" stroke="${s.color}" stroke-width="${s.w||2}" stroke-linejoin="round" stroke-linecap="round"/>`;
    if(s.dots&&(pts.length<=45||pts.length===1))for(const p of pts)o+=`<circle cx="${X(p.d)}" cy="${Y(p.v)}" r="${s.r||4}" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`;
  }
  if(cfg.pr){
    const px=X(cfg.pr.d),py=Y(cfg.pr.v),anchor=px<m.l+50?'start':px>W-m.r-50?'end':'middle';
    o+=`<circle cx="${px}" cy="${py}" r="9" fill="none" stroke="var(--ink)" stroke-width="2"/><circle cx="${px}" cy="${py}" r="5" fill="var(--ink)"/>`;
    o+=`<text class="lab" x="${px}" y="${Math.max(13,py-14)}" text-anchor="${anchor}">${esc(cfg.pr.text)}</text>`;
  }
  o+=`<line class="cross" y1="${m.t}" y2="${H-m.b}" stroke="var(--muted)" stroke-width="1" visibility="hidden"/></svg>`;
  host.innerHTML=o;
  const svg=host.querySelector('svg'),cross=host.querySelector('.cross');
  const tip=document.createElement('div');tip.className='tip';tip.hidden=true;host.append(tip);
  host.tabIndex=0;
  let idx=-1;
  const show=i=>{
    idx=i;const d=ds[i],x=X(d);cross.setAttribute('x1',x);cross.setAttribute('x2',x);cross.setAttribute('visibility','visible');
    tip.textContent='';
    const head=document.createElement('div');head.textContent=fd(dNumStr(d),{weekday:'short',day:'numeric',month:'short',year:'numeric'});tip.append(head);
    for(const s of cfg.series){const p=s.pts.find(q=>q.d===d);if(!p)continue;
      const r=document.createElement('div'),k=document.createElement('i'),b=document.createElement('b'),t=document.createElement('span');
      k.style.borderColor=s.color;b.textContent=cfg.fmt(p.v);t.textContent=s.name;r.append(k,b,t);tip.append(r)}
    tip.hidden=false;
    const sc=svg.getBoundingClientRect().width/W,px=x*sc+4,tw=tip.offsetWidth,cw=host.clientWidth;
    tip.style.left=Math.max(4,Math.min(cw-tw-4,px<cw/2?px+12:px-tw-12))+'px';
  };
  const at=e=>{const r=svg.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W;let b=0,bd=1e9;ds.forEach((d,i)=>{const q=Math.abs(X(d)-x);if(q<bd){bd=q;b=i}});show(b)};
  host.onpointerdown=at;host.onpointermove=at;
  host.onpointerleave=e=>{if(e.pointerType==='mouse'){tip.hidden=true;cross.setAttribute('visibility','hidden');idx=-1}};
  host.onkeydown=e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();show(Math.max(0,Math.min(ds.length-1,(idx<0?ds.length:idx)+(e.key==='ArrowRight'?1:-1))))}};
}
function flushCharts(){charts.forEach(([id,cfg])=>{const h=document.getElementById(id);if(h)drawChart(h,cfg)})}

function viewCalendar(){
  const t=todayStr(),tn=dayNum(t);
  if(!U.cal){const[y,m]=t.split('-').map(Number);U.cal={y,m:m-1}}
  const{y,m}=U.cal,first=Date.UTC(y,m,1)/864e5,len=(Date.UTC(y,m+1,1)/864e5)-first,off=(first+3)%7;
  const done=doneW(),ws=weekStart(tn),mk=t.slice(0,7);
  const inWeek=done.filter(w=>{const n=dayNum(w.date);return n>=ws&&n<ws+7}).length;
  const inMonth=done.filter(w=>w.date.startsWith(mk)).length,st=streak();
  const prefix=`${y}-${pad(m+1)}`;
  const counts=Object.fromEntries(S.days.map(d=>[d.id,done.filter(w=>w.type===d.id&&w.date.startsWith(prefix)).length]));
  const legend=S.days.filter(d=>!d.archived||counts[d.id]).map(d=>d.id);
  let cells='';
  for(let i=0;i<off;i++)cells+='<span></span>';
  for(let i=0;i<len;i++){
    const date=dNumStr(first+i),day=done.filter(w=>w.date===date);
    const bg=day.length===1?dayOf(day[0].type).color:day.length>1?`linear-gradient(90deg,${dayOf(day[0].type).color} 50%,${dayOf(day[1].type).color} 50%)`:'';
    const ink=day.length===1?inkOn(bg):'#12151a';
    const name=`${i+1}. ${day.length?day.map(w=>dayOf(w.type).name).join(' und '):'kein Training'}`;
    cells+=`<button class="day ${day.length?'has':''} ${date===t?'today':''}" data-a="calDay" data-date="${date}" aria-label="${esc(name)}"><span class="num" ${bg?`style="background:${bg};color:${ink}"`:''}>${i+1}</span>${day.length?`<span class="ty">${day.map(w=>le(w.type)).join('+')}</span>`:''}</button>`;
  }
  const label=utc(`${y}-${pad(m+1)}-01`).toLocaleDateString('de-DE',{timeZone:'UTC',month:'long',year:'numeric'});
  return `<div class="head"><h1>Kalender</h1></div>
  <div class="tiles">
   <div class="tile"><span>Diese Woche</span><b>${inWeek}</b><span>${inWeek===1?'Training':'Trainings'}</span></div>
   <div class="tile"><span>Diesen Monat</span><b>${inMonth}</b><span>${inMonth===1?'Training':'Trainings'}</span></div>
   <div class="tile"><span>Serie</span><b>${st}</b><span>${st===1?'Woche':'Wochen'} am Stück</span></div>
  </div>
  <div class="cal-h"><button class="icon" data-a="calMove" data-d="-1" aria-label="Voriger Monat">‹</button><button class="mon" data-a="calNow" aria-label="${esc(label)}, zurück zum aktuellen Monat">${esc(label)}</button><button class="icon" data-a="calMove" data-d="1" aria-label="Nächster Monat">›</button></div>
  <div class="cal">${['Mo','Di','Mi','Do','Fr','Sa','So'].map(d=>`<span class="wd">${d}</span>`).join('')}${cells}</div>
  <div class="stack">${legend.map(d=>`<div class="row">${plate(d,true)}<span class="grow">${dn(d)}</span><span class="sub">${counts[d]}× im ${esc(utc(`${y}-${pad(m+1)}-01`).toLocaleDateString('de-DE',{timeZone:'UTC',month:'long'}))}</span></div>`).join('')}</div>`;
}

/* ---------- Daten ---------- */
function dataSheet(){
  openSheet(`<div class="sheet-x"><h2>Daten &amp; Backup</h2><button class="btn small" data-a="close">Schließen</button></div>
   <p class="sub" style="font-size:15px">Alles liegt nur in diesem Browser. Das Backup ist eine JSON-Datei, die du sichern oder auf ein anderes Gerät übertragen kannst.</p>
   <p class="sub" style="font-size:15px">${S.workouts.length} Trainings · ${liveEx().length} Übungen · ${S.weights.length} Gewichtseinträge<br>${S.lastBackup?`Letztes Backup: ${esc(dShort(S.lastBackup))}`:'Noch kein Backup erstellt'}</p>
   <button class="btn wide primary" data-a="export">Backup exportieren</button>
   <label class="btn wide" for="imp" tabindex="0">Backup importieren</label>
   <input class="radio" type="file" id="imp" accept=".json,application/json" data-in="import">
   <p class="err" id="imp-err" hidden></p>`);
}
async function exportData(){
  const name=`trainingsbuch-backup-${todayStr()}.json`;
  const text=JSON.stringify({app:'trainingsbuch',exportedAt:new Date().toISOString(),...S,lastBackup:todayStr()},null,2);
  const file=new File([text],name,{type:'application/json'});
  const done=()=>{S.lastBackup=todayStr();save();closeSheet();render();toast('Backup erstellt')};
  if(matchMedia('(pointer:coarse)').matches&&navigator.canShare?.({files:[file]})){
    try{await navigator.share({files:[file]});return done()}
    catch(e){if(e.name==='AbortError')return}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),10000);done();
}
function importData(input){
  const f=input.files[0];if(!f)return;
  const fail=m=>{const e=$('#imp-err');e.textContent=m;e.hidden=false};
  f.text().then(txt=>{
    let d;
    try{d=validate(JSON.parse(txt))}catch(e){return fail(e instanceof SyntaxError?'Die Datei ist kein gültiges JSON. Nimm eine exportierte Backup-Datei.':e.message)}
    ask({title:'Backup importieren?',text:`Die Datei ersetzt alle Daten auf diesem Gerät (${S.workouts.length} Trainings, ${S.weights.length} Gewichtseinträge). Sie enthält ${d.workouts.length} Trainings, ${d.exercises.filter(e=>!e.deleted).length} Übungen und ${d.weights.length} Gewichtseinträge.`,ok:'Daten ersetzen'},()=>{
      d.activeId=null;S=d;U.progId=null;U.exGroup='all';U.tab='training';save();closeSheet();render(true);toast('Backup importiert')});
  }).catch(()=>fail('Die Datei ließ sich nicht lesen.'));
  input.value='';
}

/* ---------- Aktionen ---------- */
const A={
  close:closeSheet,
  askOk(){const f=pendingOk;pendingOk=null;f?.()},
  undo(){toastUndo?.();toastUndo=null;$('#toast').hidden=true},
  nav(d){U.tab=d.t;render(true)},
  histAll(){U.histAll=true;render()},
  start(d){startWorkout(d.t)},
  open(d){openWorkout(d.id)},
  wtype(d){const w=active();if(w.type===d.t)return;w.type=d.t;
    if(!w.items.some(it=>it.sets.some(s=>s.reps!=null||s.kg!=null)))w.items=planItems(d.t,w);
    save();render()},
  finish(){
    const w=active();if(!w)return;
    const partial=w.items.reduce((a,it)=>a+it.sets.filter(s=>!complete(s)&&(s.reps!=null||s.kg!=null)).length,0);
    if(partial)ask({title:'Unvollständige Sätze',text:`${partial} ${partial===1?'Satz hat':'Sätze haben'} nur Gewicht oder nur Wiederholungen. Beim Beenden werden sie verworfen.`,ok:'Verwerfen und beenden'},finishNow);
    else finishNow();
  },
  delWorkout(){const w=active();ask({title:'Training löschen?',text:`${dLong(w.date)}, ${dayOf(w.type).name}: ${setCount(w)} Sätze werden endgültig gelöscht.`,ok:'Training löschen'},()=>{
    S.workouts=S.workouts.filter(x=>x!==w);S.activeId=null;U.tab=U.returnTab||'training';save();closeSheet();render(true);toast('Training gelöscht')})},
  pick:pickerSheet,
  pickEx(d){addToWorkout(d.id)},
  pickNew(){U.afterExSave='add';exForm()},
  rmItem(d){
    const w=active(),it=w.items[d.i],name=ex(it.exerciseId).name;
    const go=()=>{w.items.splice(+d.i,1);save();closeSheet();render()};
    if(it.sets.some(s=>s.reps!=null||s.kg!=null))ask({title:'Übung entfernen?',text:`Die eingetragenen Sätze für ${name} in diesem Training werden gelöscht.`,ok:'Entfernen'},go);else go();
  },
  addSet(d){active().items[d.i].sets.push({reps:null,kg:null});save();render()},
  rmSet(d){
    const it=active().items[d.i],s=+d.s,[old]=it.sets.splice(s,1);save();render();
    if(old.reps!=null||old.kg!=null)toast('Satz gelöscht',()=>{it.sets.splice(s,0,old);save();render()});
  },
  check(d,el){
    const w=active(),it=w.items[d.i],set=it.sets[d.s];
    if(complete(set))return;
    const sg=suggestion(it,+d.s,lastTime(it.exerciseId,w));
    if(set.kg==null&&sg)set.kg=sg.kg;
    if(set.reps==null&&sg)set.reps=sg.reps;
    if(set.reps==null||set.reps<=0){$(`#re-${d.i}-${d.s}`).focus();return}
    if(set.kg==null)set.kg=0; // Körpergewichtsübung ohne Zusatzgewicht
    save();render();
  },
  exNew(){U.afterExSave=null;exForm()},
  exEdit(d){U.afterExSave=null;exForm(ex(d.id))},
  exPickG(d,el){el.parentElement.querySelectorAll('.chip').forEach(c=>{const on=c===el;c.classList.toggle('on',on);c.setAttribute('aria-pressed',on)})},
  exPickD(d,el){const on=el.classList.toggle('on');el.setAttribute('aria-pressed',on)},
  exSave(d){
    const name=$('#ex-name').value.trim(),gid=$('#ex-groups .on')?.dataset.id,days=[...document.querySelectorAll('#ex-days .on')].map(c=>c.dataset.id);
    const err=$('#ex-err'),fail=m=>{err.textContent=m;err.hidden=false};
    if(!name)return fail('Gib der Übung einen Namen.');
    if(!gid)return fail('Wähle eine Muskelgruppe.');
    if(liveEx().some(e=>e.id!==d.id&&e.name.toLowerCase()===name.toLowerCase()))return fail('Diese Übung gibt es schon.');
    if(d.id){const e=ex(d.id);if(e.name!==name)delete e.example;e.name=name;e.groupId=gid;setPlanDays(e.id,days)}
    else{
      const e={id:uid(),name,groupId:gid};S.exercises.push(e);setPlanDays(e.id,days);
      if(U.afterExSave==='add'){U.afterExSave=null;return addToWorkout(e.id)}
      if(U.afterExSave==='plan'){U.afterExSave=null;if(!dayOf(U.planDay).plan.some(p=>p.exerciseId===e.id))dayOf(U.planDay).plan.push({exerciseId:e.id,sets:3});save();planSheet();render();return}
    }
    save();closeSheet();render();toast('Übung gespeichert');
  },
  exProg(d){U.progId=d.id;U.metric=null;U.tab='fortschritt';closeSheet();render(true)},
  exDel(d){
    const e=ex(d.id),n=exHistory(e.id).length;
    ask({title:'Übung löschen?',text:n?`${e.name} verschwindet aus deiner Liste. Die ${n} eingetragenen Trainings behalten ihre Sätze.`:`${e.name} wird endgültig gelöscht.`,ok:'Übung löschen'},()=>{
      dropFromPlans(e.id);if(S.workouts.some(w=>w.items.some(i=>i.exerciseId===e.id)))e.deleted=true;else S.exercises=S.exercises.filter(x=>x!==e);
      save();closeSheet();render();toast('Übung gelöscht')});
  },
  exClear(){
    const l=liveEx().filter(e=>e.example);
    ask({title:'Beispielübungen löschen?',text:`${l.length} Übungen mit dem Hinweis „Beispiel“ verschwinden. Bereits eingetragene Sätze bleiben erhalten.`,ok:'Beispiele löschen'},()=>{
      for(const e of l){dropFromPlans(e.id);if(S.workouts.some(w=>w.items.some(i=>i.exerciseId===e.id)))e.deleted=true;else S.exercises=S.exercises.filter(x=>x!==e)}
      save();closeSheet();render();toast('Beispiele gelöscht')});
  },
  exGroup(d){U.exGroup=d.id;render()},exDay(d){U.exDay=d.id;render()},exSort(d){U.exSort=d.id;render()},
  groups:groupsSheet,
  gAdd(){S.groups.push({id:uid(),name:'Neue Gruppe',color:'#9aa5b1'});save();groupsSheet();render()},
  gDel(d){
    const e=$('#g-err'),g=grp(d.id),n=liveEx().filter(x=>x.groupId===d.id).length;
    if(n){e.textContent=`${g.name} enthält noch ${n} ${n===1?'Übung':'Übungen'}. Weise sie erst einer anderen Gruppe zu.`;e.hidden=false;return}
    if(S.groups.length<2){e.textContent='Mindestens eine Muskelgruppe muss bleiben.';e.hidden=false;return}
    S.groups=S.groups.filter(x=>x.id!==d.id);if(U.exGroup===d.id)U.exGroup='all';save();groupsSheet();render();
  },
  days:daysSheet,
  plans(){U.planDay=U.planDay||nextType();planSheet()},
  planDay(d){U.planDay=d.id;planSheet()},
  plSets(d){const p=dayOf(U.planDay).plan[d.i];p.sets=Math.min(20,Math.max(1,p.sets+ +d.d));save();planSheet();render()},
  plUp(d){const pl=dayOf(U.planDay).plan,i=+d.i;if(i<1)return;[pl[i-1],pl[i]]=[pl[i],pl[i-1]];save();planSheet();render()},
  plRm(d){dayOf(U.planDay).plan.splice(+d.i,1);save();planSheet();render()},
  plNew(){U.afterExSave='plan';exForm()},
  upItem(d){const it=active().items,i=+d.i;if(i<1)return;[it[i-1],it[i]]=[it[i],it[i-1]];save();render()},
  savePlan(){
    const w=active(),day=dayOf(w.type),old=day.plan.map(p=>({...p}));
    day.plan=w.items.filter(it=>!ex(it.exerciseId).deleted).map(it=>({exerciseId:it.exerciseId,sets:Math.min(20,Math.max(1,it.sets.length))}));
    save();render();toast(`Plan für ${day.name} gespeichert`,()=>{day.plan=old;save();render()});
  },
  dAdd(){
    let name='Neuer Tag',k=2;
    while(S.days.some(d=>d.name.toLowerCase()===name.toLowerCase()))name=`Neuer Tag ${k++}`;
    const color=DAY_COLORS.find(c=>!S.days.some(d=>d.color===c))||DAY_COLORS[0];
    S.days.push({id:uid(),name,color,plan:[]});save();daysSheet();render();
    const f=[...document.querySelectorAll('[data-in=dname]')].at(-1);f.focus();f.select();
  },
  dUp(d){
    const live=liveDays(),i=live.findIndex(x=>x.id===d.id);if(i<1)return;
    const a=S.days.indexOf(live[i-1]),b=S.days.indexOf(live[i]);
    [S.days[a],S.days[b]]=[S.days[b],S.days[a]];save();daysSheet();render();
  },
  dDel(d){
    const e=$('#d-err'),day=dayOf(d.id);
    if(liveDays().length<2){e.textContent='Mindestens ein Trainingstag muss bleiben.';e.hidden=false;return}
    const n=S.workouts.filter(w=>w.type===d.id).length;
    ask({title:'Trainingstag löschen?',text:n?`${day.name} verschwindet aus der Auswahl. ${n===1?'Das eingetragene Training bleibt':`Die ${n} eingetragenen Trainings bleiben`} erhalten, auch im Kalender. Du kannst den Tag samt Plan später zurückholen.`:`${day.name} wird gelöscht. Die zugeordneten Übungen bleiben erhalten.`,ok:'Trainingstag löschen'},()=>{
      if(n)day.archived=true;else S.days=S.days.filter(x=>x.id!==d.id);
      if(U.exDay===d.id)U.exDay='all';
      save();daysSheet();render();toast('Trainingstag gelöscht');
    });
  },
  dRestore(d){delete dayOf(d.id).archived;save();daysSheet();render()},
  metric(d){U.metric=d.id;render()},
  progRange(d){U.progRange=d.id;render()},
  wRange(d){U.wRange=d.id;render()},
  wAll(){U.wAll=true;render()},
  wSave(){
    const date=$('#w-new-date').value,kg=parseNum($('#w-new-kg').value),err=$('#w-err');
    if(!date||!kg||kg<20||kg>400){err.textContent='Gib ein Gewicht in kg ein, zum Beispiel 90,5.';err.hidden=false;return}
    const old=S.weights.find(x=>x.date===date);
    if(old)old.kg=kg;else S.weights.push({id:uid(),date,kg});
    save();render();toast(old?`Eintrag vom ${dShort(date)} aktualisiert`:'Gewicht eingetragen');
  },
  wEdit(d){
    const x=S.weights.find(o=>o.id===d.id);
    openSheet(`<h2>Eintrag bearbeiten</h2>
     <div class="bar"><label class="f">Datum<input class="input" type="date" id="we-date" value="${x.date}"></label>
     <label class="f">Gewicht (kg)<input class="input" id="we-kg" type="text" inputmode="decimal" autocomplete="off" value="${esc(num(x.kg,2))}"></label></div>
     <p class="err" id="we-err" hidden></p>
     <button class="btn wide primary" data-a="wUpd" data-id="${esc(x.id)}">Speichern</button>
     <button class="btn wide danger" data-a="wDel" data-id="${esc(x.id)}">Eintrag löschen</button>
     <button class="btn wide" data-a="close">Abbrechen</button>`);
  },
  wUpd(d){
    const x=S.weights.find(o=>o.id===d.id),date=$('#we-date').value,kg=parseNum($('#we-kg').value),err=$('#we-err');
    if(!date||!kg||kg<20||kg>400){err.textContent='Gib ein Gewicht in kg ein, zum Beispiel 90,5.';err.hidden=false;return}
    if(S.weights.some(o=>o.id!==x.id&&o.date===date)){err.textContent=`Für den ${dShort(date)} gibt es schon einen Eintrag.`;err.hidden=false;return}
    x.date=date;x.kg=kg;save();closeSheet();render();toast('Eintrag gespeichert');
  },
  wDel(d){const x=S.weights.find(o=>o.id===d.id);ask({title:'Eintrag löschen?',text:`${dLong(x.date)}: ${num(x.kg,1)} kg`,ok:'Eintrag löschen'},()=>{S.weights=S.weights.filter(o=>o!==x);save();closeSheet();render();toast('Eintrag gelöscht')})},
  goal(){
    openSheet(`<h2>Zielgewicht</h2><label class="f">Ziel (kg)<input class="input" id="g-kg" type="text" inputmode="decimal" autocomplete="off" value="${S.goal?esc(num(S.goal)):''}"></label>
     <p class="err" id="goal-err" hidden></p>
     <button class="btn wide primary" data-a="goalSave">Speichern</button>
     ${S.goal?'<button class="btn wide danger" data-a="goalDel">Ziel entfernen</button>':''}
     <button class="btn wide" data-a="close">Abbrechen</button>`);
  },
  goalSave(){const v=parseNum($('#g-kg').value);if(!v||v<20||v>400){const e=$('#goal-err');e.textContent='Gib ein Zielgewicht in kg ein, zum Beispiel 80.';e.hidden=false;return}S.goal=v;save();closeSheet();render()},
  goalDel(){S.goal=null;save();closeSheet();render()},
  calMove(d){let m=U.cal.m+ +d.d,y=U.cal.y;if(m<0){m=11;y--}if(m>11){m=0;y++}U.cal={y,m};render()},
  calNow(){U.cal=null;render()},
  calDay(d){
    const day=S.workouts.filter(w=>w.date===d.date&&hasSets(w));
    if(day.length===1)return openWorkout(day[0].id);
    if(day.length>1)return openSheet(`<div class="sheet-x"><h2>${esc(dLong(d.date))}</h2><button class="btn small" data-a="close">Schließen</button></div>
      <div class="list">${day.map(w=>`<button class="item" data-a="calOpen" data-id="${esc(w.id)}">${plate(w.type,true)}<span class="grow"><span class="t">${dn(w.type)}</span><span class="m">${setCount(w)} Sätze</span></span></button>`).join('')}</div>
      <button class="btn wide" data-a="calNew" data-date="${d.date}">+ Weiteres Training</button>`);
    startWorkout(nextType(d.date),d.date);
  },
  calOpen(d){closeSheet();openWorkout(d.id)},
  calNew(d){closeSheet();startWorkout(nextType(d.date),d.date)},
  data:dataSheet,
  export:exportData,
};
document.addEventListener('click',e=>{
  if(e.target.id==='sheet')return closeSheet();
  const t=e.target.closest('[data-a]');if(!t)return;
  A[t.dataset.a]?.(t.dataset,t,e);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet();
  if(e.key==='Enter'&&e.target.dataset?.in==='kg'){e.preventDefault();$(`#re-${e.target.dataset.i}-${e.target.dataset.s}`)?.focus()}
  if(e.key==='Enter'&&e.target.dataset?.in==='reps'){e.preventDefault();e.target.blur()}
  if(e.key==='Enter'&&e.target.id==='w-new-kg'){e.preventDefault();A.wSave()}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches?.('label[for=imp]')){e.preventDefault();$('#imp').click()}
});
document.addEventListener('input',e=>{
  const d=e.target.dataset||{};
  if(d.in==='kg'||d.in==='reps'){
    const w=active(),it=w.items[d.i],set=it.sets[d.s];
    if(d.in==='kg')set.kg=parseNum(e.target.value);
    else{const v=parseNum(e.target.value);set.reps=v==null?null:Math.round(v)}
    save();
    const row=e.target.closest('.setrow'),ok=complete(set);
    row.classList.toggle('ok',ok);
    const best=bestBefore(it.exerciseId,w);
    row.querySelector('.prflag').hidden=!(ok&&best>0&&set.kg>best);
  }
});
document.addEventListener('change',e=>{
  const d=e.target.dataset||{},v=e.target.value;
  if(d.in==='wdate'){if(v){active().date=v;save()}render()}
  if(d.in==='prog'){U.progId=v;U.metric=null;render()}
  if(d.in==='gcolor'){grp(d.id).color=v;save();render()}
  if(d.in==='gname'){const n=v.trim();if(n){grp(d.id).name=n;save();render()}else e.target.value=grp(d.id).name}
  if(d.in==='plAdd'&&v){dayOf(U.planDay).plan.push({exerciseId:v,sets:3});save();planSheet();render()}
  if(d.in==='dcolor'){dayOf(d.id).color=v;save();render()}
  if(d.in==='dname'){
    const n=v.trim(),err=$('#d-err');
    if(!n){e.target.value=dayOf(d.id).name;return}
    if(S.days.some(x=>x.id!==d.id&&x.name.toLowerCase()===n.toLowerCase())){e.target.value=dayOf(d.id).name;err.textContent=`Den Namen ${n} gibt es schon.`;err.hidden=false;return}
    err.hidden=true;dayOf(d.id).name=n;save();render();
  }
  if(d.in==='import')importData(e.target);
});

/* ---------- Rendern ---------- */
function render(top){
  charts=[];
  const w=active();
  const html=U.tab==='training'?(w?viewEditor(w):viewHome()):U.tab==='uebungen'?viewExercises():U.tab==='fortschritt'?viewProgress():U.tab==='gewicht'?viewWeight():viewCalendar();
  $('#view').innerHTML=html;
  renderTabs();
  flushCharts();
  if(top)window.scrollTo(0,0);
}
if(S.activeId&&!active())S.activeId=null;
render();
</script>
